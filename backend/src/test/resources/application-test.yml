# Локально и в GitHub Actions PostgreSQL поднимает Testcontainers; OKO_TEST_DB_URL — для внешнего PostgreSQL.
spring:
  datasource:
    url: ${OKO_TEST_DB_URL:jdbc:postgresql://localhost:5432/oko}

oko:
  public-origin: http://oko.test
  admin-logins: admin
  rater-hmac-secret: test-hmac-secret-0123456789abcdef0123456789
  rate-limit:
    # Лимитер проверяется отдельным юнит-тестом; здесь лимиты высокие, чтобы тесты не мешали друг другу.
    widget-rating-per-key: 100000
    server-rating-per-key: 100000
    rating-per-ip: 100000
    widget-config-per-key: 100000
    widget-config-per-ip: 100000

logging:
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
