# CI ОКО на GitHub Actions (перенесён с кодлаба ТПУ, бывший .gitlab-ci.yml).
#
# PR и push:   backend-verify, deploy-verify, frontend-verify, widget-e2e
# PR:          образы backend/frontend собираются без публикации.
# push в dev/main: оба образа публикуются с SHA, затем release публикует проверенную пару и конфигурацию.
name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Юнит-, интеграционные (Testcontainers: Docker на ubuntu-latest есть) и контрактные тесты.
      - run: ./mvnw -B --no-transfer-progress verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          retention-days: 7
          path: |
            backend/target/surefire-reports/
            backend/target/oko-backend-*.jar

  deploy-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck deploy/vps/pull.sh
      - run: python3 -m unittest discover -s deploy/tests -v
      - name: docker compose config (VPS)
        env:
          OKO_BACKEND_IMAGE: example.invalid/oko/backend:dev
          OKO_FRONTEND_IMAGE: example.invalid/oko/frontend:dev
          OKO_DOMAIN: oko.example.org
          OKO_ACME_EMAIL: admin@example.org
          OKO_DB_PASSWORD: validation-only
          OKO_RATER_HMAC_SECRET: validation-only-01234567890123456789
        run: docker compose -f deploy/vps/compose.yml config --quiet

  # Панель и виджет: типы, юнит-тесты, вес виджета и статика для nginx (артефакт frontend-static).
  frontend-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build:deploy
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-static
          retention-days: 14
          path: frontend/dist-deploy/

  frontend-image:
    runs-on: ubuntu-latest
    needs: [frontend-verify, deploy-verify]
    permissions:
      contents: read
      packages: write
    concurrency:
      group: frontend-image-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build:deploy
        working-directory: frontend
      - name: Сборка образа frontend (PR)
        if: github.event_name != 'push'
        run: docker build -f deploy/vps/frontend.Dockerfile -t oko-frontend:pr-check .
      - name: Публикация образа frontend (dev / main)
        if: github.event_name == 'push'
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch_head=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [ "$branch_head" != "$GITHUB_SHA" ]; then
            echo "Ветка ушла вперёд: frontend для устаревшего коммита не публикуем."
            exit 0
          fi
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}/frontend"
          docker build -f deploy/vps/frontend.Dockerfile -t "$image:$GITHUB_SHA" .
          docker push "$image:$GITHUB_SHA"
          docker tag "$image:$GITHUB_SHA" "$image:$BRANCH"
          docker push "$image:$BRANCH"

  # Виджет в настоящем Chromium: сервер выключен, 500, ответ 10 с, чужой сайт, три стека (HTML, PHP, React).
  widget-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:widget

  backend-image:
    runs-on: ubuntu-latest
    needs: [backend-verify, deploy-verify]
    permissions:
      contents: read
      packages: write
    # Публикации в одну ветку идут по очереди; старый запуск не перезапишет тег устаревшим коммитом.
    concurrency:
      group: backend-image-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Сборка образа без публикации (PR)
        if: github.event_name != 'push'
        run: |
          ./mvnw -B --no-transfer-progress -DskipTests package \
            com.google.cloud.tools:jib-maven-plugin:3.5.2:buildTar -Dimage=oko-backend:pr-check
          test -s target/jib-image.tar
      - name: Вход в GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Публикация образа (dev / main)
        if: github.event_name == 'push'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          branch_head=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [ "$branch_head" != "$GITHUB_SHA" ]; then
            echo "Ветка ушла вперёд: образ для устаревшего коммита не публикуем."
            exit 0
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}/backend"
          # Jib берёт учётные данные из ~/.docker/config.json (docker/login-action), пароль не попадает в аргументы.
          ./mvnw -B --no-transfer-progress -DskipTests package \
            com.google.cloud.tools:jib-maven-plugin:3.5.2:build \
            -Dimage="$image:$GITHUB_SHA" -Djib.to.tags="$BRANCH"
          echo "Опубликовано: $image:$GITHUB_SHA и :$BRANCH" >> "$GITHUB_STEP_SUMMARY"

  release-bundle:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [backend-image, frontend-image, widget-e2e]
    permissions:
      contents: read
      packages: write
    concurrency:
      group: release-bundle-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Публикация проверенного выпуска
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch_head=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [ "$branch_head" != "$GITHUB_SHA" ]; then
            echo "Ветка ушла вперёд: устаревший выпуск не публикуем."
            exit 0
          fi
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '{"sha":"%s","backend":"%s/backend:%s","frontend":"%s/frontend:%s"}\n' \
            "$GITHUB_SHA" "$repo" "$GITHUB_SHA" "$repo" "$GITHUB_SHA" > release.json
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f deploy/vps/release.Dockerfile -t "$repo/release:$GITHUB_SHA" .
          docker push "$repo/release:$GITHUB_SHA"
          docker tag "$repo/release:$GITHUB_SHA" "$repo/release:$BRANCH"
          docker push "$repo/release:$BRANCH"
          echo "Опубликован комплект $repo/release:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
