name: backend

on:
  push:
    branches: [dev, main]
  pull_request:
    paths:
      - "backend/**"
      - "contracts/**"
      - ".github/workflows/backend.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Юнит-, интеграционные (Testcontainers, Docker есть на ubuntu-latest) и контрактные тесты.
      - run: ./mvnw -B verify
      - name: Сборка образа
        run: docker build -t oko-backend:ci .
