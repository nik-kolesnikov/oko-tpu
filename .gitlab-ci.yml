workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages: [verify, image]

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

backend-verify:
  stage: verify
  image: eclipse-temurin:21-jdk
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: oko
    POSTGRES_USER: oko
    POSTGRES_PASSWORD: ci-only-test-password
    OKO_DB_PASSWORD: ci-only-test-password
    OKO_TEST_DB_URL: jdbc:postgresql://postgres:5432/oko
  cache:
    key: maven-java21
    paths: [.m2/repository/]
  script:
    - cd backend
    - ./mvnw -B --no-transfer-progress verify -Doko.test.external-postgres=true
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml
    paths:
      - backend/target/oko-backend-*.jar
      - backend/target/surefire-reports/

deploy-verify:
  stage: verify
  image: docker:27.5.1-cli
  script:
    - apk add --no-cache bash python3 shellcheck
    - shellcheck deploy/vps/pull.sh
    - python3 -m unittest discover -s deploy/tests -v
    - >-
      OKO_BACKEND_IMAGE=example.invalid/oko/backend:dev
      OKO_DOMAIN=oko.example.org
      OKO_ACME_EMAIL=admin@example.org
      OKO_DB_PASSWORD=validation-only
      OKO_RATER_HMAC_SECRET=validation-only-01234567890123456789
      docker compose -f deploy/vps/compose.yml config --quiet

backend-image:
  stage: image
  image: eclipse-temurin:21-jdk
  resource_group: backend-image-$CI_COMMIT_REF_SLUG
  needs:
    - job: backend-verify
      artifacts: false
    - job: deploy-verify
      artifacts: false
  cache:
    key: maven-java21
    paths: [.m2/repository/]
  script:
    # В eclipse-temurin нет git, а проверка «ветка ушла вперёд» ниже вызывает git ls-remote.
    # Ставим его во всех пайплайнах, чтобы MR-пайплайн тоже проверял этот шаг.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null
    - git --version
    - cd backend
    - |
      if [ "$CI_COMMIT_BRANCH" = main ] || [ "$CI_COMMIT_BRANCH" = dev ]; then
        : "${CI_REGISTRY:?Enable Container Registry for this project}"
        : "${CI_REGISTRY_IMAGE:?Container Registry image path is missing}"
        branch_head=$(git ls-remote origin "refs/heads/$CI_COMMIT_BRANCH" | cut -f1)
        if [ "$branch_head" != "$CI_COMMIT_SHA" ]; then
          echo "Branch advanced: skipping obsolete image."
          exit 0
        fi
        mkdir -p "$HOME/.docker"
        printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}\n' \
          "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" > "$HOME/.docker/config.json"
        chmod 600 "$HOME/.docker/config.json"
        ./mvnw -B --no-transfer-progress -DskipTests package \
          com.google.cloud.tools:jib-maven-plugin:3.5.2:build \
          -Dimage="$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA" \
          -Djib.to.tags="$CI_COMMIT_BRANCH"
      else
        ./mvnw -B --no-transfer-progress -DskipTests package \
          com.google.cloud.tools:jib-maven-plugin:3.5.2:buildTar \
          -Dimage=oko-backend:mr-check
        test -s target/jib-image.tar
      fi

# Панель и виджет: типы, юнит-тесты, вес виджета и статика для nginx (frontend/dist-deploy).
# Пока frontend/ нет в ветке, джоба не создаётся.
frontend-verify:
  stage: verify
  image: node:22-bookworm-slim
  rules:
    - exists: [frontend/package.json]
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key: npm-frontend
    paths: [.npm/]
  script:
    - cd frontend
    - npm ci --no-audit --no-fund
    - npm run typecheck
    - npx vitest run
    - npm run build:deploy
  artifacts:
    expire_in: 7 days
    paths:
      - frontend/dist-deploy/
