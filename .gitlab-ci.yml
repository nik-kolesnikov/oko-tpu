workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages: [preflight, verify, image]

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"
  TESTCONTAINERS_HOST_OVERRIDE: docker
  # Isolate the unencrypted DinD API inside this job's network.
  FF_NETWORK_PER_BUILD: "true"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

.docker-service:
  services:
    - name: docker:27.5.1-dind
      alias: docker
      command: ["--tls=false"]
      variables:
        HEALTHCHECK_TCP_PORT: "2375"

runner-check:
  extends: .docker-service
  stage: preflight
  image: docker:27.5.1-cli
  script:
    - docker info

backend-verify:
  extends: .docker-service
  stage: verify
  image: eclipse-temurin:21-jdk
  cache:
    key: maven-java21
    paths: [.m2/repository/]
  script:
    - cd backend
    - ./mvnw -B --no-transfer-progress verify
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml
    paths:
      - backend/target/oko-backend-*.jar
      - backend/target/surefire-reports/

deploy-verify:
  stage: verify
  image: docker:27.5.1-cli
  script:
    - apk add --no-cache bash python3 shellcheck
    - shellcheck deploy/vps/pull.sh
    - python3 -m unittest discover -s deploy/tests -v
    - >-
      OKO_BACKEND_IMAGE=example.invalid/oko/backend:main
      OKO_DOMAIN=oko.example.org
      OKO_ACME_EMAIL=admin@example.org
      OKO_DB_PASSWORD=validation-only
      OKO_RATER_HMAC_SECRET=validation-only-01234567890123456789
      docker compose -f deploy/vps/compose.yml config --quiet

backend-image:
  extends: .docker-service
  stage: image
  image: docker:27.5.1-cli
  # Serialise publication for each branch; never publish an obsolete pipeline to its channel.
  resource_group: backend-image-$CI_COMMIT_REF_SLUG
  needs:
    - job: backend-verify
      artifacts: true
    - job: deploy-verify
      artifacts: false
  script:
    - apk add --no-cache git
    - docker info
    - >-
      docker build --pull --build-arg JAR_SOURCE=verified
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      --label "org.opencontainers.image.source=$CI_PROJECT_URL"
      -t "oko-backend:$CI_COMMIT_SHA" backend
    - docker run --rm --entrypoint sh "oko-backend:$CI_COMMIT_SHA" -c 'java -version && curl --version'
    - |
      if [ "$CI_COMMIT_BRANCH" = main ] || [ "$CI_COMMIT_BRANCH" = dev ]; then
        : "${CI_REGISTRY:?Enable Container Registry for this project}"
        : "${CI_REGISTRY_IMAGE:?Container Registry image path is missing}"
        printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
        image="$CI_REGISTRY_IMAGE/backend"
        docker tag "oko-backend:$CI_COMMIT_SHA" "$image:$CI_COMMIT_SHA"
        docker push "$image:$CI_COMMIT_SHA"
        branch_head=$(git ls-remote origin "refs/heads/$CI_COMMIT_BRANCH" | cut -f1)
        if [ "$branch_head" = "$CI_COMMIT_SHA" ]; then
          docker tag "oko-backend:$CI_COMMIT_SHA" "$image:$CI_COMMIT_BRANCH"
          docker push "$image:$CI_COMMIT_BRANCH"
        else
          echo "Branch advanced: commit image published, channel left unchanged."
        fi
      fi
