<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тестовая страница: обычный HTML</title>
<style>
  /* Агрессивные стили «чужого» сайта: проверяем, что виджет от них не ломается */
  * { box-sizing: content-box; font-family: Georgia, serif; }
  body { max-width: 760px; margin: 40px auto; padding: 0 16px; background: #fffbe8; }
  iframe { width: 100%; height: 300px; border: 6px solid red; }
  button { background: hotpink; font-size: 30px; }
  div { padding: 20px; }
</style>
<script>
  // Имитация библиотек хоста, которые лезут в глобальную область
  window.$ = function () { return 'jquery-like'; };
  window.OKO = 'занято сайтом';
</script>
</head>
<body>
  <h1>Личный кабинет (тестовая страница)</h1>
  <p>Обычная HTML-страница со своими стилями. Через пару секунд после загрузки справа внизу должна появиться карточка оценки.</p>
  <p id="host-ok">Скрипты страницы работают: <span id="host-check">нет</span></p>
  <p><a href="?again=1">Перезагрузить</a> · Чтобы карточка показалась снова, очистите localStorage этого сайта.</p>
  <script>document.getElementById('host-check').textContent = 'да (' + $() + ')';</script>

  <!-- ОКО ТПУ: виджет оценки (код со вкладки «Интеграция») -->
  <script>
    (function (d, w) {
      var s = d.createElement('script');
      s.src = '__OKO_ORIGIN__/widget/v1/loader.js';
      s.async = true;
      s.setAttribute('data-key', '__OKO_KEY__');
      s.setAttribute('data-service-id', '__OKO_SERVICE__');
      s.setAttribute('data-version', '2.4.0');
      w.addEventListener('load', function () { d.body.appendChild(s); });
    })(document, window);
  </script>
</body>
</html>
