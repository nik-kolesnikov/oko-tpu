# ОКО ТПУ: nginx + backend + PostgreSQL на одном сервере.
# Запуск: docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Значения переменных — в deploy/.env (образец без значений: deploy/.env.example). .env в git не кладём.
name: oko

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oko
      POSTGRES_USER: oko
      POSTGRES_PASSWORD: ${OKO_DB_PASSWORD:?задайте OKO_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=256MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oko -d oko"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: ${OKO_PROFILE:-prod}
      OKO_DB_URL: jdbc:postgresql://db:5432/oko
      OKO_DB_USER: oko
      OKO_DB_PASSWORD: ${OKO_DB_PASSWORD:?задайте OKO_DB_PASSWORD}
      OKO_PUBLIC_ORIGIN: ${OKO_PUBLIC_ORIGIN:?задайте OKO_PUBLIC_ORIGIN}
      OKO_ADMIN_LOGINS: ${OKO_ADMIN_LOGINS:-}
      OKO_ADMIN_LOGIN: ${OKO_ADMIN_LOGIN:-}
      OKO_ADMIN_PASSWORD: ${OKO_ADMIN_PASSWORD:-}
      OKO_RATER_HMAC_SECRET: ${OKO_RATER_HMAC_SECRET:?задайте OKO_RATER_HMAC_SECRET}
      OKO_MONITORING_EVENT_TOKEN: ${OKO_MONITORING_EVENT_TOKEN:-}
      JAVA_OPTS: ${OKO_JAVA_OPTS:--Xmx1g -XX:+ExitOnOutOfMemoryError}
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${OKO_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/oko.conf:/etc/nginx/conf.d/default.conf:ro
      # Сборки панели и виджета (frontend/) кладутся сюда: static/panel и static/widget/v1.
      - ${OKO_STATIC_DIR:-./static}:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
