# VPS: internal HTTP behind Caddy; no published nginx ports.
# В access log — путь без query-строки: в /auth/callback приходит одноразовый code, в /widget/frame — ключ.
log_format oko_noquery '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent '
                       '$request_time "$http_user_agent"';

server {
    listen 80;
    server_name _;
    server_tokens off;
    charset utf-8;
    access_log /var/log/nginx/access.log oko_noquery;

    # Лимит тела как у backend (16 КБ): API принимает только небольшие JSON.
    # Превышение — 400 в формате Error, как отвечает backend (кода 413 в спецификации нет).
    client_max_body_size 16k;

    add_header X-Content-Type-Options nosniff always;

    # Only Caddy can reach this nginx; public HTTPS terminates there.
    # This path is used only by Docker healthchecks, never exposed through Caddy.
    location = /healthz {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://backend:8080/actuator/health;
        access_log off;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;

        # Backend недоступен — JSON в формате Error, а не HTML-страница nginx.
        # error_page здесь отменяет наследование с уровня server, поэтому 413 указан тут же.
        proxy_intercept_errors on;
        error_page 502 503 504 = @unavailable;
        error_page 413 = @too_large;
    }

    location @unavailable {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;
        return 503 '{"code":"UNAVAILABLE","message":"Сервис временно недоступен"}';
    }

    location @too_large {
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        return 400 '{"code":"VALIDATION_ERROR","message":"Некорректные данные","details":[{"field":"body","message":"тело запроса больше 16 КБ"}]}';
    }

    # Виджет для чужих сайтов: loader.js и frame.js. Версия в пути, ломающие изменения — только в /widget/v2/.
    location /widget/ {
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # actuator наружу не отдаём: health проверяется внутри сети docker.
    location /actuator/ {
        return 404;
    }

    # Панель (React SPA): все неизвестные пути — index.html.
    location / {
        root /usr/share/nginx/html/panel;
        try_files $uri /index.html;
    }
}
